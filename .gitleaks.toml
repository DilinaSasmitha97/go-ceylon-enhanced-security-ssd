[extend]
useDefault = true

[[rules]]
id = "jwt-hardcoded-secret"
description = "Hardcoded JWT Secret Key"
regex = '''(?i)(secret_key|jwt_secret)\s*[:=]\s*["']([^"']+)["']'''
secretGroup = 2
entropy = 0.0

[[rules]]
id = "mongodb-connection-string"
description = "MongoDB Connection String with Embedded Credentials"
regex = '''mongodb(\+srv)?:\/\/[a-zA-Z0-9_.-]+:[a-zA-Z0-9_.-]+@[a-zA-Z0-9_.-]+'''
secretGroup = 0
entropy = 0.0
