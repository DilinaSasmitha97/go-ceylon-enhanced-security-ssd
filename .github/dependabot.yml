# Dependabot (A03): opens pull requests when a dependency has a new release or a
# security advisory, so vulnerable libraries do not stay unnoticed. Each PR is
# checked by the security pipeline (tests, npm audit, Semgrep, ZAP).
version: 2
updates:
  - package-ecosystem: npm
    directory: /GoCeylon-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /GoCeylon-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    # xlsx is installed from the official SheetJS CDN tarball (the npm package is
    # no longer maintained), which Dependabot cannot track; update it manually.
    ignore:
      - dependency-name: xlsx

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
